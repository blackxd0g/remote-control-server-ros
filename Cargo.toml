[workspace]
members = ["art-core", "art-hbbs", "art-hbbr"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
dryoc = { version = "1.0", default-features = false, features = ["u64_backend"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8"] }
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
