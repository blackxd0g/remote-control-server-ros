name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: art-api/go.mod
          cache-dependency-path: art-api/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-musl
      - name: Go formatting
        run: test -z "$(find art-api -name '*.go' -exec gofmt -l {} +)"
      - name: Go verification
        working-directory: art-api
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
      - name: Rust verification
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release --target x86_64-unknown-linux-musl

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: docker/api.Dockerfile
            platforms: linux/amd64,linux/arm64
          - dockerfile: docker/hbbs.Dockerfile
            platforms: linux/amd64,linux/arm64
          - dockerfile: docker/hbbr.Dockerfile
            platforms: linux/amd64,linux/arm64
          - dockerfile: docker/all-in-one.Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
